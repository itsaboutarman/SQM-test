source=delta
sink=delta
logLevel=WARN
csvSeparator=|


# Delta
source.path=s3a://dns/source/
# source.startingTimestamp=2025-02-27 00:00:00.0
source.ignoreDeletes=true
source.maxBytesPerTrigger=1g
spark.sql.files.ignoreMissingFiles=true


sink.path=s3a://dnsxdr/FailureCauseLake/
sink.checkpointLocation=s3a://dnsxdr/FailureCauseLake-checkpoint/
sink.mergeSchema=true
# sink.overwriteSchema=true
sink.outputMode=append
sink.trigger=2 seconds
source_kerberos_configname=ps


# spark.sql.session.timeZone=+03:30
spark.task.maxFailures=6
spark.executor.failuresValidityInterval=1800000
spark.sql.shuffle.partitions=12
spark.sql.streaming.minBatchesToRetain=5
spark.sql.streaming.stateStore.providerClass=org.apache.spark.sql.execution.streaming.state.RocksDBStateStoreProvider
spark.sql.extensions=io.delta.sql.DeltaSparkSessionExtension
spark.sql.catalog.spark_catalog=org.apache.spark.sql.delta.catalog.DeltaCatalog
spark.cleaner.periodicGC.interval=5min
spark.cleaner.referenceTracking.blocking.shuffle=true
spark.jars.packages=org.apache.spark:spark-sql-kafka-0-10_2.12:3.5.0

