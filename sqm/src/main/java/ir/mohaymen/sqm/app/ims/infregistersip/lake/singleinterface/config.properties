source.ignoreDeletes=true
source.maxBytesPerTrigger=2500m
source.startingVersion=latest
#source.startingTimestamp=2026-01-10 20:00:00.0
source_kerberos_configname=ims
sink.kafka.bootstrap.servers=sqm-kafka-bootstrap.kafka.svc.cluster.local:9092
sink.topic=ims-inf-register-sip-single-interface
sink.checkpointLocation=s3a://ims-inf-register-sip/register-single-interface-checkpoint/
