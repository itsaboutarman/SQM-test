# =====================================================================================
# Alarm baseline batch job   (start it with CLASS_NAME=AlarmBaseline, every 15 minutes, concurrencyPolicy: Forbid)
# Template of /tmp/spark/app.properties. Replace every <...>. Do not commit real passwords.
# =====================================================================================
logLevel=WARN

# ---- Windows ---------------------------------------------------------------------------
# A run takes windows of 15 minutes, oldest first, until it is on time. There is no limit for the number of windows.
# The newest window that is due at time T:  (T rounded down to 15 minutes) - delay - 15 minutes.
# For T = 01:00 it is 00:00-00:15.
baseline.windowMinutes=15
# Waiting time for late data. It must be a whole number of windows (for example 45).
baseline.delayMinutes=45

# Where does a run start? The result table is asked FIRST, in every run: the job starts with the window after the newest
# RECORD_DATE in the table (the last checkpoint). Only if the table is EMPTY (the first run), the job uses baseline.resumeFrom.
# So this line can stay in the config. If it is not set and the table is empty, the job does only the newest window that is due.
# It must be the start of a window (a multiple of baseline.windowMinutes since 00:00).
# Set the time of the first window, for example:
# baseline.resumeFrom=2026-10-05 00:00:00

# The job stops with an error if it is more than this behind (summary_tcp keeps only 10 days). A person decides then.
baseline.maxBacklogHours=168

# If the window of one day earlier is not in the result table, all num_d* of this window are NULL.
# false = only a warning (use it for the first day). true = stop with an error.
baseline.failIfNoPreviousDay=false

# If a window needs a window that this same run has just sent, the job waits until StarRocks has loaded it.
baseline.waitForLoadMinutes=10

# ---- Tables --------------------------------------------------------------------------
# The real tables in StarRocks. The columns are chosen by the code (AlarmBaselineKpis): only the columns that the
# calculation needs are read, and StarRocks does no grouping and no calculation, it only gives the rows.
# Please check the two IMS names: the DDL says ims.summary_inf_register_sip_overview, V2_1 says ims.summary_ims_inf_register_sip_overview
#
# The ims database is in ONE StarRocks cluster, and the sqm database is in ANOTHER one. So every table says which
# JDBC connection it uses (the connections are defined in the next part). Every table can have its own connection.
baseline.source.register.table=ims.summary_inf_register_sip_overview
baseline.source.register.connection=ims
baseline.source.call.table=ims.summary_inf_call_sip_overview
baseline.source.call.connection=ims
baseline.source.tcp.table=sqm.summary_tcp
baseline.source.tcp.connection=sqm

# The result table. The job reads its rows of the window one day earlier, and it finds its position here.
baseline.target.table=sqm.summary_alarm_baseline
baseline.target.connection=sqm

# ---- StarRocks (JDBC, MySQL protocol, FE query port): one connection for each cluster -------------
# The word after "jdbc." is the name of the connection. Each connection has its own url, user and password.
# You can add more connections (for example jdbc.register.url) and use them in baseline.*.connection above.
# The options are given to Spark's JDBC reader as they are.
#
# connection "ims": the cluster of the ims database (register and call tables)
jdbc.ims.url=jdbc:mysql://<ims-cluster-fe-host>:9030
jdbc.ims.driver=com.mysql.cj.jdbc.Driver
jdbc.ims.user=<user>
jdbc.ims.password=<password>
jdbc.ims.fetchsize=10000
# read one window in several parts at the same time (optional)
jdbc.ims.numPartitions=4

# connection "sqm": the cluster of the sqm database (tcp table and the result table)
jdbc.sqm.url=jdbc:mysql://<sqm-cluster-fe-host>:9030
jdbc.sqm.driver=com.mysql.cj.jdbc.Driver
jdbc.sqm.user=<user>
jdbc.sqm.password=<password>
jdbc.sqm.fetchsize=10000
jdbc.sqm.numPartitions=4

# ---- Kafka (the result: one JSON message for each row, written by Spark's own Kafka writer) ----
sink.kafka.bootstrap.servers=<kafka-hosts>
# the topic that the StarRocks Routine Load reads. Agree on the name with the StarRocks side.
sink.topic=<for example alarm-baseline-starrocks>
# Any other producer option goes here as sink.kafka.<name>, for example sink.kafka.security.protocol
# Do NOT set transactional.id: Spark's Kafka writer does not support Kafka transactions.

# ---- Spark ---------------------------------------------------------------------------
spark.app.name=alarm-baseline
spark.metrics.namespace=alarm-baseline
spark.sql.shuffle.partitions=50
# the Kafka connector (as in the other jobs) and the MySQL driver for StarRocks
spark.jars.packages=org.apache.spark:spark-sql-kafka-0-10_2.12:3.5.0,com.mysql:mysql-connector-j:8.0.33

# Resources: sized for ONE window of 15 minutes. A catch-up does the windows one after the other with the same resources.
spark_driver_cores=1
spark_driver_coreLimit="1500m"
spark_driver_memory="3048m"
spark_executor_cores=2
spark_executor_coreLimit="1500m"
spark_executor_instances=4
spark_executor_memory="4096m"
spark_executor_overhead="1000m"
spark_executor_coreRequest="1500m"