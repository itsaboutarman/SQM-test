source=delta
sink=Kafka
logLevel=INFO
csvSeparator=|



# Delta
source.path=s3a://ims-inf-register-sip/source-dropped-duplicates/
source.ignoreDeletes=true
source_kerberos_configname=ims
source.maxBytesPerTrigger=4000m
source.startingVersion=latest
#source.startingTimestamp=2026-01-01 00:00:00.0
spark.sql.files.ignoreMissingFiles=true


sink.kafka.bootstrap.servers=sqm-kafka-bootstrap.kafka.svc.cluster.local:9092
sink.topic=ims-inf-register-sip-summary
sink.checkpointLocation=s3a://ims-inf-register-sip/ims-register-summary-checkpoint-keyhashgrouping2/
sink.outputMode=update
sink.trigger=0 seconds


spark.sql.shuffle.partitions=100
spark.sql.streaming.minBatchesToRetain=5
spark.sql.streaming.stateStore.providerClass=org.apache.spark.sql.execution.streaming.state.RocksDBStateStoreProvider
spark.sql.extensions=io.delta.sql.DeltaSparkSessionExtension
spark.sql.catalog.spark_catalog=org.apache.spark.sql.delta.catalog.DeltaCatalog
spark.cleaner.periodicGC.interval=5min
spark.cleaner.referenceTracking.blocking.shuffle=true
spark.jars.packages=org.apache.spark:spark-sql-kafka-0-10_2.12:3.5.0

