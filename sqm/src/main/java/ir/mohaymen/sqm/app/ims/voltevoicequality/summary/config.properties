source=delta
sink=Kafka
logLevel=WARN
csvSeparator=|



# Delta
source.path=s3a://volte-voice-quality/source/
source.ignoreDeletes=true
source_kerberos_configname=ims
source.maxBytesPerTrigger=500m

sink.kafka.bootstrap.servers=sqm-kafka-bootstrap.kafka.svc.cluster.local:9092
sink.topic=volte-voice-quality-mute-summary
sink.checkpointLocation=s3a://volte-voice-quality/summary-voicequality-mute-checkpoint/
sink.outputMode=update
sink.trigger=0 seconds


spark.sql.shuffle.partitions=20
spark.sql.streaming.minBatchesToRetain=5
spark.sql.streaming.stateStore.providerClass=org.apache.spark.sql.execution.streaming.state.RocksDBStateStoreProvider
spark.sql.extensions=io.delta.sql.DeltaSparkSessionExtension
spark.sql.catalog.spark_catalog=org.apache.spark.sql.delta.catalog.DeltaCatalog
spark.cleaner.periodicGC.interval=5min
spark.cleaner.referenceTracking.blocking.shuffle=true
spark.jars.packages=org.apache.spark:spark-sql-kafka-0-10_2.12:3.5.0

spark.metrics.conf.*.sink.graphite.period=10
spark.metrics.conf.*.sink.graphite.port=2003
spark.metrics.conf.*.sink.graphite.unit=seconds
spark.metrics.conf.*.sink.graphite.host=spark-dashboard-influx.monitoring.svc
spark.metrics.conf.*.sink.graphite.class=org.apache.spark.metrics.sink.GraphiteSink
spark.metrics.conf.*.source.jvm.class=org.apache.spark.metrics.source.JvmSource
spark.metrics.conf.*.sink.graphite.prefix=luca
spark.metrics.appStatusSource.enabled=true
spark.metrics.namespace=voice-quality-mute-summary

spark.sql.streaming.checkpointFileManagerClass=org.apache.spark.internal.io.cloud.AbortableStreamBasedCheckpointFileManager
