variables:
  namespace: streaming-apps
  SPARK_MAIN_APP_FILE_NAME_PREFIX: Streaming-analytics
  SPARK_VERSION: spark4.0.1

stages:
  - build

build_jar:
  stage: build
  image: docker-sqm.mci.ir/kubectl:1.33.5
  only:
    - main
  when: manual
  script:
    - export KUBECONFIG=${KUBECONFIG_FILE}
    - source script_build_jar.sh